name: Release DBX plugin

# Builds one unsigned .dbxp candidate per supported target and attaches them to
# the published GitHub Release, via the official reusable DBX Store workflow.
# The dbx-plugin CLI packages on the target platform's own runner (no host
# cross-compilation). Signing is performed by DBX Store maintainers after review
# — see https://github.com/t8y2/dbx/blob/main/plugins/RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to (re)build assets for
        required: true

permissions:
  contents: write

jobs:
  release:
    # Pinned to the tag that publishes the matching dbx-plugin CLI (0.1.2).
    # The @plugin-sdk-v1 ref shown in the SDK template does not exist upstream;
    # plugin-cli-v0.1.2 carries this reusable workflow and matches the
    # plugin-cli-version passed below.
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-cli-v0.1.2
    with:
      release-tag: ${{ github.event.release.tag_name || inputs.release_tag }}
      # package.mjs delegates to the precompiled dbx-plugin CLI installed by the
      # reusable workflow and injects GOFLAGS=-tags=my2sql so the shipped
      # sidecar links the real go-mysql binlog kernel. The env prefix runs in
      # the reusable workflow's bash build step on every runner.
      package-command: DBX_MY2SQL_TAGS=my2sql node package.mjs
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.2
      go-version: "1.22.x"
      # The Go sidecar builds with CGO_ENABLED=0; no Rust toolchain is needed
      # because the precompiled CLI embeds the packager.
      rust-toolchain: ""
      build-matrix: >-
        {"include":[{"runner":"ubuntu-24.04","target":"linux-x64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64"},{"runner":"windows-2022","target":"windows-x64"},{"runner":"macos-15-intel","target":"darwin-x64"},{"runner":"macos-15","target":"darwin-arm64"}]}
